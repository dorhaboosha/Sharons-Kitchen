services:
  postgres:
    image: postgres:16
    container_name: sharons_kitchen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharons_kitchen
      POSTGRES_PASSWORD: sharons_kitchen
      POSTGRES_DB: sharons_kitchen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
