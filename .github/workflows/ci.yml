name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build and typecheck all workspaces
        run: npm run build

      - name: Tests
        run: npm test --if-present

      # Informational only for now: some advisories sit in transitive deps that
      # need major-version bumps (tracked via Dependabot PRs). Does not fail CI.
      - name: Dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
